name: Palace water motion review
on:
  push:
    branches: [codex/palace-water-motion]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run build && npm run build:qa
      - run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Real idle PC water motion
        run: node tests/palace-water-summons.mjs
      - name: Real idle mobile water motion
        if: always()
        run: node tests/palace-water-summons.mjs --mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-motion-review
          path: tests/artifacts

name: Palace imugi review
on:
  push:
    branches: [codex/palace-imugi]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run build && npm run build:qa
      - run: node --test tests/tools/branch-codec.test.mjs
      - run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Actual palace generation, combat, fish and debug rendering
        run: node tests/palace-imugi.mjs
      - name: Native species, cannon and descendant regression
        if: always()
        run: node tests/run.mjs --only battle,summonBrood,crossfireCannon
      - name: Book movement, saves, native pixels and actual palace UI
        if: always()
        run: node tests/palace-water-summons.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imugi-review
          path: tests/artifacts

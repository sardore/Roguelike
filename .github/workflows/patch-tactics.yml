name: Apply tactical core patch

on:
  push:
    branches: [dev/tactical-viewport]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/tactical-viewport
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-tactics.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Commit patched core
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/game.ts
          git commit -m "gameplay: add telegraphed threats, guard and reach"
          git push origin HEAD:dev/tactical-viewport

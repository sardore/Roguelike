name: Imugi balance and artwork review
on:
  push:
    branches: [codex/imugi-rebalance-art]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run build && npm run build:qa
      - run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Turn damage, spell gaps, saved actors, world and debug art
        run: node tests/palace-imugi.mjs
      - name: Unrelated native species, cannon and brood regression
        if: always()
        run: node tests/run.mjs --only battle,crossfireCannon,summonBrood
      - name: Existing summons and palace inspections
        if: always()
        run: node tests/palace-water-summons.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imugi-balance-review
          path: tests/artifacts

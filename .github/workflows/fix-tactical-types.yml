name: Fix tactical type errors

on:
  push:
    branches: [dev/tactical-viewport]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/tactical-viewport
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrow type fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/core/game.ts')
          s=p.read_text()
          s=s.replace("    const primary = def.tags.some((tag) => context.primary.monsterTags.includes(tag)) ? 1.8 : 1;\n    const blend = context.blend && def.tags.some((tag) => context.blend.target.monsterTags.includes(tag)) ? 1 + context.blend.weight : 1;", "    const primary = def.tags.some((tag) => context.primary.monsterTags.includes(tag)) ? 1.8 : 1;\n    const blendContext = context.blend;\n    const blend = blendContext && def.tags.some((tag) => blendContext.target.monsterTags.includes(tag)) ? 1 + blendContext.weight : 1;")
          s=s.replace("  const [x, y] = status.sourceId.split(',').map(Number);\n  return Number.isFinite(x) && Number.isFinite(y) ? { x, y } : null;", "  const parts = status.sourceId.split(',');\n  const x = Number(parts[0]), y = Number(parts[1]);\n  return Number.isFinite(x) && Number.isFinite(y) ? { x, y } : null;")
          p.write_text(s)
          p=Path('src/ui/render.ts')
          s=p.read_text()
          s=s.replace("  const [x,y]=threat.sourceId.split(',').map(Number);\n  return Number.isFinite(x)&&Number.isFinite(y)?{x,y}:null;", "  const parts=threat.sourceId.split(',');const x=Number(parts[0]),y=Number(parts[1]);\n  return Number.isFinite(x)&&Number.isFinite(y)?{x,y}:null;")
          p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/game.ts src/ui/render.ts
          git commit -m "fix: satisfy strict tactical type checks"
          git push origin HEAD:dev/tactical-viewport

name: Apply deep systems migration

on:
  push:
    branches: [dev/deep-systems-volume]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/deep-systems-volume
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded migration
        run: node scripts/apply-deep-systems.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Commit migrated files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/content/items.ts src/content/monsters.ts src/core/game.ts src/ui/render.ts src/main.ts
          git commit -m "gameplay: integrate deep systems and expanded catalogs"
          git push origin HEAD:dev/deep-systems-volume

name: Spider nerf validation
on:
  push:
    branches: [codex/mother-spider-nerf]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Focused brood and value baselines
        run: npm test -- --only motherSpider,values --update --label spider-nerf
      - name: Verify focused brood, definitions and save restoration
        run: npm test -- --only motherSpider,values,saves --label spider-nerf-verify
      - name: Report reviewed baseline changes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const before=JSON.parse(execFileSync('git',['show','HEAD:tests/baseline/behaviour.json'],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync('tests/baseline/behaviour.json','utf8'));
          const changed=Object.fromEntries(Object.entries(after).filter(([key,value])=>before[key]!==value));
          console.log('SPIDER_BASELINE_CHANGES='+JSON.stringify(changed));
          console.log('SPIDER_STING_RESULT='+fs.readFileSync('tests/artifacts/spider-nerf-verify/motherSpider.sting.txt','utf8'));
          JS

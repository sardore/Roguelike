name: Apply fullscreen classic pass

on:
  push:
    branches: [dev/fullscreen-classic-depth]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/fullscreen-classic-depth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate and verify
        run: |
          set +e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='scripts/apply-fullscreen-classic-pass.mjs';
          let s=fs.readFileSync(path,'utf8');
          s=s.replace("pushMessage(state,`A named presence haunts this floor: ${def.name}.`);","pushMessage(state,'A named presence haunts this floor: '+def.name+'.');");
          fs.writeFileSync(path,s);
          NODE
          {
            node scripts/apply-fullscreen-classic-pass.mjs
            A=$?
            if [ "$A" -eq 0 ]; then npm install --no-audit --no-fund; B=$?; else B=99; fi
            if [ "$B" -eq 0 ]; then npm test; C=$?; else C=99; fi
            if [ "$C" -eq 0 ]; then npm run build; D=$?; else D=99; fi
            echo "statuses patch=$A install=$B test=$C build=$D"
          } > classic-pass-report.txt 2>&1
          STATUS=0
          grep -q 'statuses patch=0 install=0 test=0 build=0' classic-pass-report.txt || STATUS=1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$STATUS" -ne 0 ]; then
            git add classic-pass-report.txt
            git commit -m "ci: record fullscreen classic integration failure" || true
            git push origin HEAD:dev/fullscreen-classic-depth
            cat classic-pass-report.txt
            exit 1
          fi
          rm scripts/apply-fullscreen-classic-pass.mjs .github/workflows/apply-fullscreen-classic-pass.yml classic-pass-report.txt
          git add -A
          git commit -m "gameplay: fill the mobile screen and deepen classic roguelike play"
          git push origin HEAD:dev/fullscreen-classic-depth

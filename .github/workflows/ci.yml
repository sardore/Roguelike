name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Structure check
        run: npm run check
      - name: Branch codec and summon normalization checks
        run: node --test tests/tools/branch-codec.test.mjs
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Actual branch follower transfers and stored-floor cleanup
        run: npm run build:qa && node tests/branch-followers.mjs
      - name: Stationary book summons, native sprites and bounded palace water
        run: node tests/palace-water-summons.mjs && node tests/palace-water-summons.mjs --mobile
      - name: Palace imugi, rapid actions and aquatic pursuit
        run: node tests/palace-imugi.mjs
      - name: Behaviour and screenshots on the QA build (seeded replay, V40 saves, floors, debug arena, pinned fonts)
        run: npm test -- --skip render
      - name: Release source publishes no QA hooks and saves the same data
        run: npm run build:dev && npm test -- --target src --label src
      - name: Same behaviour from the single HTML build
        run: npm test -- --target single --label single
      - name: Installable app (manifest, service worker, offline relaunch, offline new run)
        run: npm test -- --target app --label app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: behaviour-artifacts
          path: tests/artifacts
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: manru-dist
          path: dist
          if-no-files-found: error

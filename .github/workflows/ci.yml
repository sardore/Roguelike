name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Structure check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Behaviour preservation on src (seeded replay, V40 saves, floors, debug arena)
        run: npm test -- --skip screens,render
      - name: Same behaviour from the single HTML build
        run: npm test -- --target single --only newgame,saves,battle --label single
      - name: Installable app (manifest, service worker, offline relaunch, offline new run)
        run: npm test -- --target app --only pwa,newgame --label app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: behaviour-artifacts
          path: tests/artifacts
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: manru-dist
          path: dist
          if-no-files-found: error

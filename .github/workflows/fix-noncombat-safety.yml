name: Finalize noncombat safety

on:
  push:
    branches: [dev/noncombat-i18n]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/noncombat-i18n
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrow safety/localization fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/core/game.ts')
          s=p.read_text()
          old="if (target === 'player' ? monsterAt(state, next.x, next.y) : (samePoint(state.player, next) || state.monsters.some((other) => other.id !== entity.id && samePoint(other, next)))) break;"
          new="if (target === 'player' ? monsterAt(state, next.x, next.y) : (settlementProtected(state, next) || samePoint(state.player, next) || state.monsters.some((other) => other.id !== entity.id && samePoint(other, next)))) break;"
          if old in s:s=s.replace(old,new)
          elif new not in s:raise SystemExit('push safety anchor missing')
          p.write_text(s)

          p=Path('src/i18n.ts')
          s=p.read_text()
          anchor="    [/^You sell (.+) for (\\d+) gold\\.$/,(x)=>`${x[1]}을(를) ${x[2]}골드에 팔았다.`],[/^You enter (.+)\\.$/,(x)=>`${x[1]}에 들어섰다.`]"
          replacement="    [/^You sell (.+) for (\\d+) gold\\.$/,(x)=>`${x[1]}을(를) ${x[2]}골드에 팔았다.`],[/^You enter (.+)\\.$/,(x)=>`${x[1]}에 들어섰다.`],[/^(.+) dies\\. You recover (\\d+) gold\\.$/,(x)=>`${x[1]}이(가) 죽었다. ${x[2]}골드를 회수했다.`],[/^You crack the cache and recover two objects and (\\d+) gold\\.$/,(x)=>`보관함을 열어 물건 두 개와 ${x[1]}골드를 건졌다.`],[/^You rest and recover (\\d+) HP\\.$/,(x)=>`휴식하여 HP를 ${x[1]} 회복했다.`]"
          if anchor in s:s=s.replace(anchor,replacement)
          elif replacement not in s:raise SystemExit('message pattern anchor missing')
          exact_old="'You crack the cache and recover two objects.':'보관함을 열어 물건 두 개를 건졌다.'"
          exact_new="'You crack the cache and recover two objects.':'보관함을 열어 물건 두 개를 건졌다.','The healer restores you completely.':'치료사가 체력을 완전히 회복시켰다.','The healer clears your afflictions.':'치료사가 해로운 상태를 정화했다.','There is nothing harmful to cleanse.':'정화할 해로운 상태가 없다.','You do not have enough gold.':'골드가 부족하다.','The cartographer marks the entire reachable level.':'지도상이 이 층에서 갈 수 있는 곳을 모두 표시했다.','The shrine grants a long blessing.':'성소에서 오래 지속되는 축복을 받았다.','Locals mark the known descents and warn that deeper side routes become unstable.':'주민들이 알려진 하강로를 표시하며, 옆길 깊숙한 곳은 불안정해진다고 경고한다.','That service has already been used here.':'이 장소의 서비스는 이미 이용했다.','You are already fully healed.':'이미 체력이 가득하다.'"
          if exact_old in s:s=s.replace(exact_old,exact_new)
          elif exact_new not in s:raise SystemExit('exact localization anchor missing')
          p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Commit fixes and remove one-shot workflow
        run: |
          rm .github/workflows/fix-noncombat-safety.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/game.ts src/i18n.ts .github/workflows/fix-noncombat-safety.yml
          git commit -m "fix: protect settlements and polish Korean messages"
          git push origin HEAD:dev/noncombat-i18n

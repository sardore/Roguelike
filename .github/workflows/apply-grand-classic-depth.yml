name: Apply grand classic depth pass

on:
  push:
    branches: [dev/grand-classic-depth]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/grand-classic-depth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply, test, and build
        run: |
          set +e
          {
            python scripts/apply-grand-classic-depth.py
            A=$?
            if [ "$A" -eq 0 ]; then npm install --no-audit --no-fund; B=$?; else B=99; fi
            if [ "$B" -eq 0 ]; then npm test; C=$?; else C=99; fi
            if [ "$C" -eq 0 ]; then npm run build; D=$?; else D=99; fi
            echo "statuses patch=$A install=$B test=$C build=$D"
          } > grand-depth-report.txt 2>&1
          STATUS=0
          grep -q 'statuses patch=0 install=0 test=0 build=0' grand-depth-report.txt || STATUS=1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$STATUS" -ne 0 ]; then
            git add grand-depth-report.txt
            git commit -m "ci: record grand depth integration failure" || true
            git push origin HEAD:dev/grand-classic-depth
            cat grand-depth-report.txt
            exit 1
          fi
          rm scripts/apply-grand-classic-depth.py .github/workflows/apply-grand-classic-depth.yml grand-depth-report.txt
          git add -A
          git commit -m "gameplay: deepen traditional systems terrain and mobile feedback"
          git push origin HEAD:dev/grand-classic-depth

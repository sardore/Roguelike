name: Apply terrain town variation pass

on:
  push:
    branches: [dev/terrain-town-variation]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/terrain-town-variation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply, test, and build
        run: |
          set +e
          {
            python scripts/apply-variation-integration.py
            A=$?
            if [ "$A" -eq 0 ]; then npm install --no-audit --no-fund; B=$?; else B=99; fi
            if [ "$B" -eq 0 ]; then npm test; C=$?; else C=99; fi
            if [ "$C" -eq 0 ]; then npm run build; D=$?; else D=99; fi
            echo "statuses patch=$A install=$B test=$C build=$D"
          } > variation-report.txt 2>&1
          STATUS=0
          grep -q 'statuses patch=0 install=0 test=0 build=0' variation-report.txt || STATUS=1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$STATUS" -ne 0 ]; then
            git add -A
            git commit -m "ci: record terrain town integration failure" || true
            git push origin HEAD:dev/terrain-town-variation
            cat variation-report.txt
            exit 1
          fi
          rm scripts/apply-variation-integration.py .github/workflows/apply-variation-integration.yml variation-report.txt
          git add -A
          git commit -m "world: diversify terrain settlements and actor-anchored effects"
          git push origin HEAD:dev/terrain-town-variation

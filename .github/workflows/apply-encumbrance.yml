name: Apply encumbrance foundation

on:
  push:
    branches: [dev/mega-foundations]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/mega-foundations
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch, test, and build
        run: |
          set +e
          {
            node scripts/apply-encumbrance.mjs
            A=$?
            if [ "$A" -eq 0 ]; then npm install --no-audit --no-fund; B=$?; else B=99; fi
            if [ "$B" -eq 0 ]; then npm test; C=$?; else C=99; fi
            if [ "$C" -eq 0 ]; then npm run build; D=$?; else D=99; fi
            echo "statuses patch=$A install=$B test=$C build=$D"
          } > encumbrance-report.txt 2>&1
          STATUS=0
          grep -q 'statuses patch=0 install=0 test=0 build=0' encumbrance-report.txt || STATUS=1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$STATUS" -ne 0 ]; then
            git add encumbrance-report.txt
            git commit -m "ci: record encumbrance integration failure" || true
            git push origin HEAD:dev/mega-foundations
            cat encumbrance-report.txt
            exit 1
          fi
          rm scripts/apply-encumbrance.mjs .github/workflows/apply-encumbrance.yml encumbrance-report.txt
          git add -A
          git commit -m "gameplay: add encumbrance and finalize mega foundation pass"
          git push origin HEAD:dev/mega-foundations

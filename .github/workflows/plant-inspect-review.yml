name: Plant summon and palace inspection review
on:
  push:
    branches: [codex/plant-summon-palace-inspect]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run build && npm run build:qa
      - run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Plant mobility, stationary others, save restoration and actual inspection titles
        run: node tests/palace-water-summons.mjs
      - name: Native plants and summoned descendants keep their traits
        if: always()
        run: node tests/run.mjs --only battle,summonBrood,crossfireCannon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plant-inspection-review
          path: tests/artifacts

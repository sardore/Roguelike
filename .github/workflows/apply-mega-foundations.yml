name: Apply mega foundations

on:
  push:
    branches: [dev/mega-foundations]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev/mega-foundations
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate, verify, and report
        run: |
          set +e
          {
            echo '=== source integration ==='
            sed -i 's/String\.raw`/`/g' scripts/apply-mobile-command-ui.mjs
            node scripts/apply-mega-foundations.mjs
            A=$?
            if [ "$A" -eq 0 ]; then node scripts/apply-mobile-command-ui.mjs; B=$?; else B=99; fi
            if [ "$A" -eq 0 ] && [ "$B" -eq 0 ]; then npm install --no-audit --no-fund; C=$?; else C=99; fi
            if [ "$C" -eq 0 ]; then npm test; D=$?; else D=99; fi
            if [ "$D" -eq 0 ]; then npm run build; E=$?; else E=99; fi
            echo "statuses source=$A ui=$B install=$C test=$D build=$E"
          } > integration-report.txt 2>&1
          STATUS=0
          grep -q 'statuses source=0 ui=0 install=0 test=0 build=0' integration-report.txt || STATUS=1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$STATUS" -ne 0 ]; then
            git add integration-report.txt
            git commit -m "ci: record mega integration failure" || true
            git push origin HEAD:dev/mega-foundations
            cat integration-report.txt
            exit 1
          fi
          rm scripts/apply-mega-foundations.mjs scripts/apply-mobile-command-ui.mjs .github/workflows/apply-mega-foundations.yml integration-report.txt
          git add -A
          git commit -m "gameplay: integrate survival progression commands and mobile deck"
          git push origin HEAD:dev/mega-foundations

name: Summon brood validation
on:
  push:
    branches: [codex/summoned-brood-death]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npx --yes playwright@1.56.1 install --with-deps chromium
      - run: npm test -- --only summonBrood,values --update --label summon-brood
      - run: npm test -- --only summonBrood,motherSpider,values,battle,saves --label summon-brood-verify
      - name: Report reviewed baselines
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const before=JSON.parse(execFileSync('git',['show','HEAD:tests/baseline/behaviour.json'],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync('tests/baseline/behaviour.json','utf8'));
          console.log('SUMMON_BROOD_BASELINE_CHANGES='+JSON.stringify(Object.fromEntries(Object.entries(after).filter(([k,v])=>before[k]!==v))));
          for(const file of fs.existsSync('tests/artifacts/summon-brood')?fs.readdirSync('tests/artifacts/summon-brood'):[])if(file.startsWith('summonBrood.'))console.log('SUMMON_BROOD_RESULT='+file+':'+fs.readFileSync('tests/artifacts/summon-brood/'+file,'utf8'));
          JS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: summon-brood-debug
          path: tests/artifacts

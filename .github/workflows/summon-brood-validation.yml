name: Final brood and food validation
on:
  push:
    branches: [codex/summoned-brood-death]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npx --yes playwright@1.56.1 install --with-deps chromium
      - run: npm test -- --only charcoalFood,summonBrood,motherSpider,values,battle,saves,features --label final-brood-food
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: final-brood-food-debug
          path: tests/artifacts
